<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#050b14" />
            <stop offset="50%" stop-color="#0a1f4a" />
            <stop offset="100%" stop-color="#00f0ff" />
        </linearGradient>
        <linearGradient id="dnaGrad" x1="-100%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00f0ff" />
            <stop offset="100%" stop-color="#7000ff" />
        </linearGradient>
        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@900&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap');
        
        .title {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 42px;
            fill: #ffffff;
            text-anchor: middle;
        }
        .subtitle {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
            font-size: 15px;
            fill: #94a3b8;
            letter-spacing: 0.5px;
            text-anchor: middle;
        }
        
        /* Bulletproof rotation animation using local origin */
        .dna-helix {
            animation: spinDNA 10s linear infinite;
        }
        
        @keyframes spinDNA {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>

    <!-- Background exactly like capsule-render waving style -->
    <path d="M 0 0 L 1000 0 L 1000 120 Q 750 160 500 120 T 0 120 Z" fill="url(#bgGrad)" />
    
    <!-- Accent wave outline for depth -->
    <path d="M 0 120 Q 250 80 500 120 T 1000 120" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.35" />

    <!-- Centered Text -->
    <text x="50%" y="80" class="title">Yulia Nuzhnenko</text>
    <text x="50%" y="112" class="subtitle">Computational Biologist — Multi-Omics | AI Pipelines | Data Science</text>

    <!-- DNA Helix positioned on the left side, rotating around its own center (0,0) -->
    <g transform="translate(100, 65)" filter="url(#glow)">
        <g class="dna-helix">
            <!-- DNA Backbone 1 -->
            <path d="M -40,-15 C -20,-35 20,35 40,15" fill="none" stroke="url(#dnaGrad)" stroke-width="3" />
            <!-- DNA Backbone 2 -->
            <path d="M -40,15 C -20,35 20,-35 40,-15" fill="none" stroke="url(#dnaGrad)" stroke-width="3" />
            
            <!-- Rungs (Base Pairs) -->
            <line x1="-30" y1="-21" x2="-30" y2="21" stroke="#00f0ff" stroke-width="2" opacity="0.8" />
            <line x1="-15" y1="-14" x2="-15" y2="14" stroke="#00f0ff" stroke-width="2" opacity="0.8" />
            <line x1="15" y1="14" x2="15" y2="-14" stroke="#7000ff" stroke-width="2" opacity="0.8" />
            <line x1="30" y1="21" x2="30" y2="-21" stroke="#7000ff" stroke-width="2" opacity="0.8" />
            
            <!-- Nodes -->
            <circle cx="-40" cy="-15" r="4.5" fill="#00f0ff" />
            <circle cx="-40" cy="15" r="4.5" fill="#7000ff" />
            <circle cx="-30" cy="-21" r="4" fill="#00f0ff" />
            <circle cx="-30" cy="21" r="4" fill="#00f0ff" />
            <circle cx="-15" cy="-14" r="4" fill="#00f0ff" />
            <circle cx="-15" cy="14" r="4" fill="#00f0ff" />
            
            <circle cx="15" cy="14" r="4" fill="#7000ff" />
            <circle cx="15" cy="-14" r="4" fill="#7000ff" />
            <circle cx="30" cy="21" r="4" fill="#7000ff" />
            <circle cx="30" cy="-21" r="4" fill="#7000ff" />
            <circle cx="40" cy="15" r="4.5" fill="#00f0ff" />
            <circle cx="40" cy="-15" r="4.5" fill="#7000ff" />
        </g>
    </g>
</svg>
