<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#050b14" />
            <stop offset="50%" stop-color="#0a1428" />
            <stop offset="100%" stop-color="#0d1b2a" />
        </linearGradient>
        <linearGradient id="chromoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#00f0ff" />
            <stop offset="100%" stop-color="#7000ff" />
        </linearGradient>
        <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#7000ff" stop-opacity="0.15" />
            <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.05" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@900&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap');
        
        .title {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 42px;
            fill: #ffffff;
        }
        .title-accent {
            fill: #00f0ff;
        }
        .subtitle {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
            font-size: 15px;
            fill: #94a3b8;
            letter-spacing: 0.5px;
        }
        
        .chromosome-container {
            transform-box: fill-box;
            transform-origin: center;
            animation: floatAndRotate 6s ease-in-out infinite;
        }
        
        @keyframes floatAndRotate {
            0% {
                transform: translateY(0px) rotate(-5deg);
            }
            50% {
                transform: translateY(-8px) rotate(10deg);
            }
            100% {
                transform: translateY(0px) rotate(-5deg);
            }
        }

        .wave-bg {
            animation: waveMotion 12s linear infinite;
        }
        
        @keyframes waveMotion {
            0% { transform: translateX(0); }
            50% { transform: translateX(-20px); }
            100% { transform: translateX(0); }
        }
    </style>

    <!-- Background -->
    <rect width="1000" height="200" fill="url(#bgGrad)" />

    <!-- Wave 1 (Back) -->
    <path class="wave-bg" d="M0,150 C300,130 600,170 1020,140 L1020,200 L0,200 Z" fill="url(#waveGrad)" />
    
    <!-- Wave 2 (Front) -->
    <path d="M0,165 C300,180 700,150 1000,170 L1000,200 L0,200 Z" fill="#050b14" />

    <!-- Chromosome Graphic -->
    <g class="chromosome-container" transform="translate(90, 95)" filter="url(#glow)">
        <!-- Left Chromatid -->
        <path d="M-10,-40 C-10,-48 -2,-48 -2,-40 C-2,-15 -5,-5 -5,0 C-5,5 -2,15 -2,40 C-2,48 -10,48 -10,40 C-10,15 -7,5 -7,0 C-7,-5 -10,-15 -10,-40 Z" fill="url(#chromoGrad)" />
        <!-- Right Chromatid -->
        <path d="M2,-40 C2,-48 10,-48 10,-40 C10,-15 7,-5 7,0 C7,5 10,15 10,40 C10,48 2,48 2,40 C2,15 5,5 5,0 C5,-5 2,-15 2,-40 Z" fill="url(#chromoGrad)" />
        <!-- Centromere -->
        <circle cx="0" cy="0" r="3.5" fill="#00f0ff" />
    </g>

    <!-- Text -->
    <text x="180" y="92" class="title">Yulia Nuzhnenko</text>
    <text x="180" y="128" class="subtitle">Computational Biologist — Multi-Omics | AI Pipelines | Data Science</text>
</svg>
