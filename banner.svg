<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="100%" height="100%">
    <defs>
        <!-- The exact capsule-render gradient: 0:050b14, 50:0a1f4a, 100:00f0ff -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#050b14" />
            <stop offset="50%" stop-color="#0a1f4a" />
            <stop offset="100%" stop-color="#00f0ff" />
        </linearGradient>
        <linearGradient id="dnaGrad" x1="-100%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00f0ff" />
            <stop offset="100%" stop-color="#7000ff" />
        </linearGradient>
        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@900&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap');
        
        .title {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 42px;
            fill: #ffffff;
            text-anchor: middle;
        }
        .subtitle {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
            font-size: 15px;
            fill: #94a3b8;
            letter-spacing: 0.5px;
            text-anchor: middle;
        }
        
        /* Smooth rotation animation for the DNA helix */
        .dna-helix {
            animation: spinDNA 12s linear infinite;
        }
        
        @keyframes spinDNA {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>

    <!-- Background with dynamic morphing wave at the bottom (exactly like capsule-render's waving type animation) -->
    <path fill="url(#bgGrad)">
        <animate 
            attributeName="d" 
            dur="10s" 
            repeatCount="indefinite"
            values="
                M 0 0 L 1000 0 L 1000 120 Q 750 145 500 120 T 0 120 Z;
                M 0 0 L 1000 0 L 1000 130 Q 750 110 500 135 T 0 130 Z;
                M 0 0 L 1000 0 L 1000 115 Q 750 150 500 115 T 0 115 Z;
                M 0 0 L 1000 0 L 1000 120 Q 750 145 500 120 T 0 120 Z
            " />
    </path>
    
    <!-- Accent wave outline for depth, also morphing in sync -->
    <path fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.3">
        <animate 
            attributeName="d" 
            dur="10s" 
            repeatCount="indefinite"
            values="
                M 0 120 Q 250 80 500 120 T 1000 120;
                M 0 130 Q 250 90 500 130 T 1000 130;
                M 0 115 Q 250 75 500 115 T 1000 115;
                M 0 120 Q 250 80 500 120 T 1000 120
            " />
    </path>

    <!-- Centered Text -->
    <text x="50%" y="78" class="title">Yulia Nuzhnenko</text>
    <text x="50%" y="110" class="subtitle">Computational Biologist — Multi-Omics | AI Pipelines | Data Science</text>

    <!-- DNA Helix positioned in the left corner, rotating around its local origin (0,0) -->
    <g transform="translate(100, 60)" filter="url(#glow)">
        <g class="dna-helix">
            <!-- DNA Backbone 1 -->
            <path d="M -30,-12 C -15,-27 15,27 30,12" fill="none" stroke="url(#dnaGrad)" stroke-width="2.5" />
            <!-- DNA Backbone 2 -->
            <path d="M -30,12 C -15,27 15,-27 30,-12" fill="none" stroke="url(#dnaGrad)" stroke-width="2.5" />
            
            <!-- Rungs (Base Pairs) -->
            <line x1="-22" y1="-16" x2="-22" y2="16" stroke="#00f0ff" stroke-width="1.5" opacity="0.8" />
            <line x1="-11" y1="-11" x2="-11" y2="11" stroke="#00f0ff" stroke-width="1.5" opacity="0.8" />
            <line x1="11" y1="11" x2="11" y2="-11" stroke="#7000ff" stroke-width="1.5" opacity="0.8" />
            <line x1="22" y1="16" x2="22" y2="-16" stroke="#7000ff" stroke-width="1.5" opacity="0.8" />
            
            <!-- Nodes -->
            <circle cx="-30" cy="-12" r="3.5" fill="#00f0ff" />
            <circle cx="-30" cy="12" r="3.5" fill="#7000ff" />
            <circle cx="-22" cy="-16" r="3" fill="#00f0ff" />
            <circle cx="-22" cy="16" r="3" fill="#00f0ff" />
            <circle cx="-11" cy="-11" r="3" fill="#00f0ff" />
            <circle cx="-11" cy="11" r="3" fill="#00f0ff" />
            
            <circle cx="11" cy="11" r="3" fill="#7000ff" />
            <circle cx="11" cy="-11" r="3" fill="#7000ff" />
            <circle cx="22" cy="16" r="3" fill="#7000ff" />
            <circle cx="22" cy="-16" r="3" fill="#7000ff" />
            <circle cx="30" cy="12" r="3.5" fill="#00f0ff" />
            <circle cx="30" cy="-12" r="3.5" fill="#7000ff" />
        </g>
    </g>
</svg>
