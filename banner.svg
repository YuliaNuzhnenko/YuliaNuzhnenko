<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="100%" height="100%">
    <defs>
        <!-- The exact capsule-render gradient: 0:050b14, 50:0a1f4a, 100:00f0ff -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#050b14" />
            <stop offset="50%" stop-color="#0a1f4a" />
            <stop offset="100%" stop-color="#00f0ff" />
        </linearGradient>
        <linearGradient id="dnaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#00f0ff" />
            <stop offset="100%" stop-color="#7000ff" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@900&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap');
        
        .title {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 42px;
            fill: #ffffff;
            text-anchor: middle;
        }
        .subtitle {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
            font-size: 15px;
            fill: #94a3b8;
            letter-spacing: 0.5px;
            text-anchor: middle;
        }
        
        /* Floating/rotating DNA helix in the left corner */
        .dna-helix {
            transform-box: fill-box;
            transform-origin: center;
            animation: rotateDNA 12s linear infinite;
        }
        
        @keyframes rotateDNA {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>

    <!-- Background with Waving shape at the bottom exactly like capsule-render -->
    <!-- capsule-render waving formula: M 0 0 L 1000 0 L 1000 130 Q 750 100 500 130 T 0 130 Z -->
    <path d="M 0 0 L 1000 0 L 1000 120 Q 750 160 500 120 T 0 120 Z" fill="url(#bgGrad)" />
    
    <!-- Accent wave outline for depth -->
    <path d="M 0 120 Q 250 80 500 120 T 1000 120" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.3" />

    <!-- Centered Text (matching original capsule-render positioning) -->
    <text x="50%" y="80" class="title">Yulia Nuzhnenko</text>
    <text x="50%" y="112" class="subtitle">Computational Biologist — Multi-Omics | AI Pipelines | Data Science</text>

    <!-- DNA Helix Logo in the left corner, rotating and glowing -->
    <g class="dna-helix" transform="translate(60, 55)" filter="url(#glow)">
        <!-- DNA Backbone 1 -->
        <path d="M -15,-20 C -5,-25 5,-15 15,-20" fill="none" stroke="url(#dnaGrad)" stroke-width="2" />
        <!-- DNA Backbone 2 -->
        <path d="M -15,20 C -5,15 5,25 15,20" fill="none" stroke="url(#dnaGrad)" stroke-width="2" />
        
        <!-- Base Pairs (Rungs) -->
        <line x1="-12" y1="-19" x2="-12" y2="19" stroke="#00f0ff" stroke-width="1.5" opacity="0.8" />
        <line x1="-6" y1="-21" x2="-6" y2="21" stroke="#00f0ff" stroke-width="1.5" opacity="0.8" />
        <line x1="0" y1="-20" x2="0" y2="20" stroke="#7000ff" stroke-width="1.5" opacity="0.8" />
        <line x1="6" y1="-17" x2="6" y2="17" stroke="#7000ff" stroke-width="1.5" opacity="0.8" />
        <line x1="12" y1="-19" x2="12" y2="19" stroke="#00f0ff" stroke-width="1.5" opacity="0.8" />
        
        <!-- Nodes -->
        <circle cx="-12" cy="-19" r="3" fill="#00f0ff" />
        <circle cx="-12" cy="19" r="3" fill="#00f0ff" />
        <circle cx="-6" cy="-21" r="3" fill="#00f0ff" />
        <circle cx="-6" cy="21" r="3" fill="#00f0ff" />
        <circle cx="0" cy="-20" r="3.5" fill="#7000ff" />
        <circle cx="0" cy="20" r="3.5" fill="#7000ff" />
        <circle cx="6" cy="-17" r="3" fill="#7000ff" />
        <circle cx="6" cy="21" r="3" fill="#7000ff" />
        <circle cx="12" cy="-19" r="3" fill="#00f0ff" />
        <circle cx="12" cy="19" r="3" fill="#00f0ff" />
    </g>
</svg>
